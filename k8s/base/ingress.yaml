apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gastro-api-ingress
  namespace: gastro-api
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - gastro.opik.net  # Замените на ваш домен
    secretName: gastro-api-tls
  rules:
  - host: gastro.opik.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gastro-api-service
            port:
              number: 80